# ==============================================================================
# EcoFinds - Production Docker Compose Orchestration
# ==============================================================================
name: ecofinds-production

services:
  # ── PostgreSQL Relational Database ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: ecofinds-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecofinds_prod_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ecofinds}
    ports:
      - "127.0.0.1:5432:5432" # Bind to localhost to prevent direct public exposure
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - backup-data:/backups/ecofinds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecofinds-network

  # ── EcoFinds Backend REST API ───────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ecofinds-prod-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ecofinds_prod_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-ecofinds}?schema=public
      JWT_SECRET: ${JWT_SECRET:-ecofinds_super_secret_jwt_key_prod_change_me_immediately_2026_production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ecofinds-network

  # ── EcoFinds Next.js Frontend ───────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ecofinds-prod-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      INTERNAL_API_URL: http://api:4000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 0"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ecofinds-network

networks:
  ecofinds-network:
    driver: bridge

volumes:
  postgres-data:
    name: ecofinds_prod_postgres_data
  backup-data:
    name: ecofinds_prod_backups
